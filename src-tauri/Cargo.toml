[package]
name = "togglinux"
version = "1.0.0"
description = "Unofficial Toggl Track desktop client for Linux"
authors = ["ToggLinux contributors"]
license = "MIT"
repository = "https://github.com/JayCodist/ToggLinux"
edition = "2021"

[lib]
name = "togglinux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
keyring = { version = "3", features = ["linux-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["time", "macros", "sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# Idle detection over the session D-Bus bus (Mutter IdleMonitor, KDE
# ScreenSaver). Already in the lock tree through the single-instance plugin,
# so this adds no new compile cost. Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
