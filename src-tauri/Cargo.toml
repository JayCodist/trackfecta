[package]
name = "togglinux"
version = "1.0.0"
description = "Unofficial Toggl Track desktop client for Linux"
authors = ["ToggLinux contributors"]
license = "MIT"
repository = "https://github.com/JayCodist/ToggLinux"
edition = "2021"

[lib]
name = "togglinux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
keyring = { version = "3", features = ["linux-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["time", "macros", "sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# Tray-icon text rendering: real desktop font via Pango/Cairo (system libs,
# already present through the GTK stack Tauri itself requires).
cairo-rs = "0.18"
pango = { version = "0.18", features = ["v1_42"] }
pangocairo = "0.18"
