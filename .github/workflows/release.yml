name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build AppImage/deb/rpm on the oldest supported runner for maximum
          # glibc compatibility across Ubuntu 22.04+. A single Linux build
          # avoids asset-name collisions in the release (the bundles are not
          # OS-versioned) and still runs on both 22.04 and 24.04.
          - platform: "ubuntu-22.04"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf xdg-utils libssl-dev libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build and publish bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater signs each bundle and writes a .sig. The action then
          # publishes latest.json, which the in-app updater reads. The private
          # key lives in repo secrets; the public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Trackfecta v__VERSION__"
          releaseBody: |
            Trackfecta is a beautiful, but unofficial Toggl Track desktop client for Linux.
            It is not affiliated with or endorsed by Toggl.

            Pick the asset that matches your system (all are x86_64):

            - **Ubuntu / Debian:** the `.deb` asset.
              `sudo apt install ./Trackfecta_*_amd64.deb`
            - **Fedora / openSUSE / RHEL:** the `.rpm` asset.
              `sudo rpm -Uvh Trackfecta-*.x86_64.rpm`
            - **Any Linux (self-contained):** the `.AppImage` asset.
              `chmod +x Trackfecta_*.AppImage` and run it. The AppImage also
              updates itself in app from Settings.

            GNOME users need the AppIndicator extension for the tray icon.
            See the README for setup and the Wayland hotkey note.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          # Enable updater artifacts only in CI. Local `npm run tauri:build`
          # stays keyless because the committed config leaves this off.
          args: '--config {"bundle":{"createUpdaterArtifacts":true}}'
