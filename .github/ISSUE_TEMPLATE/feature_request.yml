name: Feature request
description: Suggest an idea for Trackfecta
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please keep one feature per issue
        so discussion and triage stay focused.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: I always have to open the web app when I want to...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: What should happen, from a user's point of view?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Other ways you thought about solving the same problem.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project does this touch?
      options:
        - Timer / entries UI
        - Tray & background behaviour
        - Idle detection
        - Shortcuts
        - Toggl API / sync
        - Settings
        - Packaging / distribution
        - Documentation
        - Other
  - type: checkboxes
    id: scope
    attributes:
      label: Scope notes
      options:
        - label: I understand reports remain out of scope (we link to the web app)
          required: false
        - label: I would be willing to help implement or test this
          required: false
